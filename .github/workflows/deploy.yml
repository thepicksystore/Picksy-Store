- name: Install
  run: npm ci

# 👇 AA AHIYA ADD KARVU
- name: Check Supabase secrets
  env:
    VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  run: |
    if [ -z "$VITE_SUPABASE_URL" ]; then
      echo "ERROR: VITE_SUPABASE_URL is EMPTY"
      exit 1
    fi

    if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
      echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY is EMPTY"
      exit 1
    fi

    echo "SUCCESS: Both Supabase secrets are available."

- name: Build
  env:
    VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  run: npm run build